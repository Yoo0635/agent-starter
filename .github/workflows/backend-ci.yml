name: Backend CI

on:
  pull_request:
    branches: [develop]
    paths:
      - "drrk_BE/**"
      - "docker-compose.yml"
      - "deploy/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-deploy.yml"
  push:
    branches: [develop]
    paths:
      - "drrk_BE/**"
      - "docker-compose.yml"
      - "deploy/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-deploy.yml"

jobs:
  backend-test:
    name: Backend Gradle tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run backend tests
        working-directory: drrk_BE
        run: |
          chmod +x ./gradlew
          ./gradlew :common:test :main:test :collector:test --no-daemon

  docker-build:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate local compose file
        run: docker compose --env-file .env.example config --quiet

      - name: Validate production compose files
        run: |
          docker compose --env-file deploy/main/.env.example -f deploy/main/compose.yml config --quiet
          docker compose --env-file deploy/collector/.env.example -f deploy/collector/compose.yml config --quiet

      - name: Validate nginx config
        run: |
          cert_dir="$(mktemp -d)"
          mkdir -p "$cert_dir/live/api.example.com" "$cert_dir/www"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=api.example.com" \
            -keyout "$cert_dir/live/api.example.com/privkey.pem" \
            -out "$cert_dir/live/api.example.com/fullchain.pem" >/dev/null 2>&1
          docker run --rm --add-host app-main-blue:127.0.0.1 \
            -e ROOT_DOMAIN=example.com \
            -e ACTIVE_APP_UPSTREAM=app-main-blue:8080 \
            -e NGINX_ENVSUBST_FILTER="^(ROOT_DOMAIN|ACTIVE_APP_UPSTREAM)$" \
            -v "$PWD/deploy/main/nginx/templates:/etc/nginx/templates:ro" \
            -v "$cert_dir:/etc/letsencrypt:ro" \
            -v "$cert_dir/www:/var/www/certbot:ro" \
            nginx:1.27-alpine /bin/sh -c "/docker-entrypoint.sh nginx -t"

      - name: Build backend images
        run: |
          docker build -f drrk_BE/app-main/Dockerfile -t drrk-app-main:ci drrk_BE
          docker build -f drrk_BE/app-collector/Dockerfile -t drrk-app-collector:ci drrk_BE
